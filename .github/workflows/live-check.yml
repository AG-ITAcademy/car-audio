name: Live playlist check

# Started by hand. Loads the mood playlists from YouTube with the NewPipeExtractor
# version in the build, and prints which ones load (see LivePlaylistCheck).
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Load the mood playlists
        env:
          CAR_AUDIO_LIVE: "1"
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'ro.ag.caraudio.LivePlaylistCheck'
